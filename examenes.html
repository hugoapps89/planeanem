<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan con IA | Exámenes</title>
<link rel="stylesheet" href="style.css?v=48">
<link rel="stylesheet" href="examenes.css?v=2">
</head>
<body>
<div class="app">
<aside class="sidebar">
<a href="index.html#inicio" class="brand-card brand-logo-image"><img src="assets/logo-plan-con-ia.png" alt="Plan con IA"></a>
<nav class="menu">
<button class="menu-item" data-view="inicio"><span>🏠</span>Inicio</button>
<button class="menu-item" data-view="nueva"><span>✨</span>Nueva planeación</button>
<button class="menu-item" data-view="mis"><span>📚</span>Mis planeaciones</button>
<button class="menu-item" data-view="favoritos"><span>⭐</span>Favoritos</button>
<button class="menu-item active" data-view="examenes"><span>📝</span>Exámenes</button>
<button class="menu-item" data-view="perfil"><span>👩‍🏫</span>Mi perfil</button>
<button class="menu-item" data-view="config"><span>⚙️</span>Configuración</button>
</nav>
</aside>
<main>
<header class="topbar"><a class="mobile-back" href="index.html#inicio">←</a><img class="mobile-top-logo" src="assets/logo-plan-con-ia.png" alt="Plan con IA"></header>
<main class="exam-app">
<header class="exam-head"><div><span>Plan con IA</span><h1>📝 Crear examen</h1><p>Selecciona contenidos y PDA de tu base curricular.</p></div></header>
<section class="card"><h2>🎓 1. Datos curriculares</h2><div class="grid"><label>Grado<select id="grade"><option value="1">1.º Primaria</option><option value="2">2.º Primaria</option><option value="3">3.º Primaria</option><option value="4">4.º Primaria</option><option value="5">5.º Primaria</option><option value="6">6.º Primaria</option></select></label><label>Fase<select id="phase" disabled><option value="3">Fase 3</option><option value="4">Fase 4</option><option value="5">Fase 5</option></select></label><label>Campo formativo<select id="field"><option>Lenguajes</option><option>Saberes y Pensamiento Científico</option><option>Ética, Naturaleza y Sociedades</option><option>De lo Humano y lo Comunitario</option></select></label></div></section>
<section class="card"><h2>📚 2. Contenidos</h2><p>Marca uno o varios contenidos que deseas evaluar.</p><div id="contents" class="choices"></div></section>
<section class="card"><h2>🎯 3. PDA</h2><p>Selecciona los PDA que deseas evaluar. Se muestran separados igual que en Nueva planeación.</p><div id="pdas" class="choices"></div></section>
<section class="card"><h2>⚙️ 4. Configuración</h2><div class="grid"><label>Número de preguntas<select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></label><label>Tipo de preguntas<select id="type"><option value="mixed">Mixto</option><option value="multiple">Opción múltiple</option><option value="open">Respuesta abierta</option><option value="problem">Situación problemática</option></select></label><label>Nombre del examen<input id="examName" placeholder="Evaluación de aprendizaje"></label></div><button id="generate" class="primary">✨ Generar examen</button></section>
<section id="result" class="card result hidden"></section>
</main>
</main>
</div>
<script src="curriculum/fase3.js?v=28"></script><script src="curriculum/fase4.js?v=28"></script><script src="curriculum/fase5.js?v=28"></script>
<script src="examenes.js?v=2"></script>
</body></html>
